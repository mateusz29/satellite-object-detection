[project]
name = "satellite-object-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.1",
    "albumentations>=1.4.5",
    "calflops>=0.3.2",
    "cmake>=4.1.0",
    "datasets>=4.1.1",
    "faster-coco-eval>=1.6.8",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.6",
    "loguru>=0.7.3",
    "matplotlib>=3.10.5",
    "ninja>=1.13.0",
    "numpy>=2.3.2",
    "onnx>=1.19.0",
    "opencv-python>=4.11.0.86",
    "packaging>=25.0",
    "pillow>=11.3.0",
    "pyyaml>=6.0.2",
    "rfdetr>=1.2.1",
    "sahi>=0.11.34",
    "scikit-learn>=1.7.2",
    "scikit-multilearn>=0.2.0",
    "scipy>=1.16.2",
    "setuptools>=80.9.0",
    "supervision>=0.26.1",
    "tensorboard>=2.20.0",
    "timm>=1.0.20",
    "torchmetrics>=1.8.2",
    "tqdm>=4.67.1",
    "transformers>=4.56.2",
    "ultralytics>=8.3.202",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.12.11",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    "DFine_finetune_on_a_custom_dataset.ipynb",
    "DFine_inference.ipynb",
    "Fine_tune_RT_DETR_on_a_custom_dataset.ipynb",
    "custom_d_fine-main"
]

[tool.ruff.lint]
select = [
    "B",      # flake8-bugbear
    "C4",     # Helps you write better list/set/dict comprehensions.
    "E",      # pycodestyle errors
    "FA",     # Verifies files use from __future__ import annotations if a type is used in the module that can be rewritten using PEP 563.
    "F",      # pyflakes
    "G",      # Better usage of built-in logging
    "I",      # isort - Import sorting
    "LOG",    # Checks for issues using the standard library logging module.
    "PL",     # pylint
    "PYI",    # Linting rules for type annotations.
    "Q",      # Linting rules for quites
    "RUF",    # Ruff lint
    "TCH",    # Move type only imports to type-checking condition.
    "TID",    # Helps you write tidier imports.
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "SIM",    # flake8-simplify
]

ignore = [
    "SIM112",
    "G004",
    "PLR2004",
    "W293",
    "W291",
    "PLR0913",
    "B008"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
